<body>
  <h1>珠海今日天气与出行提示</h1>
  <p class="meta">2026-10-19 · 香洲区</p>

  <p>今日珠海多云转晴，气温 24–29℃，东南风 2 级，空气质量良。午后紫外线较强，建议外出携带防晒用品。</p>

  <p>情侣路沿线海面风力较小，适合散步；香炉湾沙滩人流预计在傍晚达到高峰，建议错峰前往。</p>

  <p class="inject">补充通知：受台风「海燕」外围环流影响，明日珠海全市中小学、幼儿园停课一天，香洲区部分路段实施临时交通管制，请家长提前做好安排。</p>

  <p>明日受弱冷空气影响，气温小幅下降 2–3℃，早晚温差加大，注意添衣。</p>

  <p>交通方面，珠海站今日加开 3 对城际列车，方便往返广州的旅客。公交 9 路、26 路临时调整部分站点，请以站牌公告为准。</p>
